<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IBA Prep Hub</title>
<meta name="description" content="IBA preparation dashboard with chapter tests, grand tests and mock tests.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brandMark">I</div><div><b>IBA Prep</b><small>Practice Hub</small></div></div>
  <nav>
    <button class="nav active" data-view="dashboard">⌂ <span>Dashboard</span></button>
    <button class="nav" data-view="chapters">▦ <span>Chapter Tests</span></button>
    <button class="nav" data-view="grand">◈ <span>Grand Tests</span></button>
    <button class="nav" data-view="mock">◉ <span>Mock Tests</span></button>
    <button class="nav" data-view="bookmarks">★ <span>Bookmarks</span></button>
    <button class="nav" data-view="progress">◔ <span>Progress</span></button>
  </nav>
  <div class="sidebarBottom">
    <div class="local"><i></i><div><b>Local study mode</b><small>Progress stays on this device</small></div></div>
    <button class="theme" id="themeBtn">☾ <span>Dark mode</span></button>
  </div>
</aside>
<main class="main">
<header class="topbar">
  <button class="mobile" id="mobileBtn">☰</button>
  <div class="crumb" id="crumb">Dashboard</div>
  <div class="topRight"><label class="search">⌕ <input id="search" placeholder="Search tests, chapters, questions…"></label><div class="avatar">I</div></div>
</header>
<section id="view-dashboard" class="view active"></section>
<section id="view-chapters" class="view"></section>
<section id="view-grand" class="view"></section>
<section id="view-mock" class="view"></section>
<section id="view-bookmarks" class="view"></section>
<section id="view-progress" class="view"></section>
<section id="view-quiz" class="view"></section>
</main>
</div>
<div id="toast" class="toast"></div>
<script src="data.js"></script><script src="app.js"></script>
</body></html>
